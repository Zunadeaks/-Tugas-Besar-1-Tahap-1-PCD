<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f8fafc">
  <title>Puzzle Studio</title>
  <link rel="stylesheet" href="fallback.css?v=2">
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4" async></script>
  <style type="text/tailwindcss">
    @layer base {
      button, input, a { @apply focus-visible:outline-2 focus-visible:outline-offset-4 focus-visible:outline-indigo-500; }
      button { @apply cursor-pointer disabled:cursor-not-allowed; }
    }
    @layer components {
      .glass-card { @apply rounded-3xl border border-white/40 bg-white/80 p-6 shadow-xl shadow-slate-200/50 backdrop-blur-md sm:p-8; }
      .preview-tab { @apply min-h-11 flex-1 rounded-xl bg-slate-100 px-4 py-2 text-sm font-medium whitespace-nowrap text-slate-600 transition hover:bg-slate-200/70; }
      .preview-tab[aria-pressed="true"] { @apply bg-indigo-600 text-white shadow-md shadow-indigo-200/60 hover:bg-indigo-700; }
      .result-img { @apply max-h-[480px] max-w-full rounded-xl object-contain shadow-md; }
      .pieces { @apply grid w-full grid-cols-2 gap-3 sm:grid-cols-3; }
      .piece { @apply min-w-0 rounded-xl border border-slate-200 bg-white/90 p-3 text-center text-xs break-all text-slate-600 transition hover:border-indigo-400 hover:shadow-md; }
      .piece img { @apply mb-2 h-28 w-full object-contain; }
      #drop.drag { @apply border-indigo-500 bg-indigo-100/70; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { transition: none !important; }
    }
  </style>
</head>
<body class="min-h-screen bg-slate-50 font-sans text-slate-800 antialiased">
  <!-- Soft ambient color, isolated from interactive content. -->
  <div aria-hidden="true" class="pointer-events-none fixed inset-0 overflow-hidden">
    <div class="absolute -top-40 -left-32 h-[640px] w-[640px] rounded-full bg-linear-to-br from-indigo-500 to-violet-400 opacity-20 blur-3xl"></div>
    <div class="absolute -right-40 -bottom-48 h-[700px] w-[700px] rounded-full bg-linear-to-tr from-sky-400 to-blue-300 opacity-20 blur-3xl"></div>
  </div>

  <main class="studio-main relative flex min-h-screen items-center justify-center px-4 py-10 sm:px-6 lg:px-10">
    <div class="w-full max-w-6xl">
      <div class="studio-layout grid items-stretch gap-6 lg:grid-cols-[360px_minmax(0,1fr)]">
        <!-- Settings -->
        <aside class="glass-card" aria-labelledby="settings-title">
          <h1 id="settings-title" class="mb-6 text-3xl font-black tracking-tight text-slate-800">Puzzle Generator</h1>

          <div class="space-y-5">
            <label id="drop" class="upload-zone group relative flex min-h-52 cursor-pointer flex-col items-center justify-center rounded-2xl border-2 border-dashed border-indigo-200/80 bg-indigo-50/30 p-8 text-center transition-colors duration-300 hover:border-indigo-400 hover:bg-indigo-50/60 focus-within:outline-2 focus-within:outline-offset-4 focus-within:outline-indigo-500">
              <input id="file" type="file" accept="image/png,image/jpeg,image/webp,image/bmp,image/tiff" aria-label="Unggah gambar" class="absolute inset-0 h-full w-full cursor-pointer opacity-0">
              <span class="mb-4 flex size-12 items-center justify-center rounded-2xl border border-white bg-white/90 text-indigo-600 shadow-sm transition-colors duration-300">
                <svg aria-hidden="true" class="size-6" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 16V3m-5 5 5-5 5 5M4 15v4a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-4"/></svg>
              </span>
              <strong id="filename" class="max-w-full text-sm font-semibold wrap-anywhere text-slate-700">Pilih gambar</strong>
              <span class="mt-1 text-xs text-slate-500">atau tarik gambar ke sini</span>
              <span class="mt-4 text-xs text-slate-400">Maks. 15 MB</span>
            </label>

            <div class="flex items-center justify-between gap-3">
              <p class="text-xs text-slate-500">9 potongan · Bingkai 5 × 5</p>
              <span class="min-w-16 rounded-lg border border-slate-200/70 bg-slate-100 px-3 py-1.5 text-center text-xs font-bold text-slate-700 tabular-nums">3 × 3</span>
            </div>

            <button id="generate" disabled class="flex min-h-12 w-full items-center justify-center gap-3 rounded-xl bg-indigo-600 px-5 py-3 text-sm font-bold text-white shadow-md shadow-indigo-300 transition-colors duration-200 enabled:hover:bg-indigo-700 disabled:opacity-60">
              Buat puzzle
              <svg aria-hidden="true" class="size-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14m-6-6 6 6-6 6"/></svg>
            </button>
          </div>
          <p id="status" role="status" aria-live="polite" class="mt-4 text-center text-xs leading-relaxed text-slate-500">Pilih gambar untuk mulai.</p>
        </aside>

        <!-- Preview -->
        <section class="glass-card flex min-w-0 flex-col" aria-labelledby="preview-title">
          <div class="mb-6 flex flex-wrap items-center justify-between gap-3">
            <h2 id="preview-title" class="text-lg font-bold tracking-tight text-slate-800">Meja puzzle</h2>
            <span id="dimensions" class="text-xs text-slate-500 tabular-nums">—</span>
          </div>
          <div role="group" aria-label="Tampilan pratinjau" class="mb-6 flex flex-wrap gap-2 self-start rounded-2xl border border-white/70 bg-slate-100/70 p-1.5 max-sm:w-full">
            <button class="preview-tab active" data-tab="play" aria-pressed="true">Main</button>
            <button class="preview-tab" data-tab="frame" aria-pressed="false">Bingkai</button>
            <button class="preview-tab" data-tab="original" aria-pressed="false">Gambar asli</button>
            <button class="preview-tab" data-tab="pieces" aria-pressed="false">Potongan</button>
          </div>

          <div id="canvas" class="flex min-h-[400px] flex-1 items-center justify-center overflow-auto rounded-2xl border border-white/90 bg-linear-to-br from-slate-50/90 via-white/50 to-indigo-50/40 p-5 shadow-inner shadow-slate-200/30 sm:p-8"></div>

          <div class="mt-6 flex flex-wrap items-center justify-between gap-4 border-t border-slate-200/60 pt-5">
            <span id="count" class="text-xs text-slate-500">Belum ada hasil</span>
            <button id="download" disabled class="ml-auto flex min-h-11 items-center justify-center gap-2 rounded-xl border border-indigo-200 bg-indigo-50 px-4 py-2.5 text-sm font-semibold text-indigo-700 transition enabled:hover:bg-indigo-100 disabled:border-slate-200/80 disabled:bg-slate-100/80 disabled:text-slate-500 disabled:shadow-none">
              <svg aria-hidden="true" class="size-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12m-5-5 5 5 5-5M4 16v3a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-3"/></svg>
              Unduh ZIP
            </button>
          </div>
        </section>
      </div>
    </div>
  </main>

  <template id="empty-state">
    <div class="flex flex-col items-center justify-center py-10 text-center">
      <svg aria-hidden="true" class="mb-4 h-20 w-20 text-indigo-200" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 3H5a2 2 0 0 0-2 2v4h2a3 3 0 1 1 0 6H3v4a2 2 0 0 0 2 2h4v-2a3 3 0 1 1 6 0v2h4a2 2 0 0 0 2-2v-4h-2a3 3 0 1 1 0-6h2V5a2 2 0 0 0-2-2h-4v2a3 3 0 1 1-6 0V3Z"/></svg>
      <h3 class="mb-1 text-xl font-bold text-slate-700">Belum ada hasil</h3>
      <p class="max-w-60 text-sm leading-relaxed text-slate-400">Pilih gambar lalu klik Buat puzzle</p>
    </div>
  </template>
  <script>
    document.getElementById('canvas').append(
      document.getElementById('empty-state').content.cloneNode(true)
    );
  </script>
  <script src="game-state.js?v=1"></script>
  <script src="game.js?v=2"></script>
  <script src="app.js?v=20261015-5"></script>
</body>
</html>
